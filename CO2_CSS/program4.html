
<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="program7.css">
</head>
<body>

    <div class="product-card">

        <img class="product-card__image"
             src="https://picsum.photos/200"
             width="100">

        <h3 class="product-card__title">Shoes</h3>

        <p class="product-card__price">₹999</p>

    </div>

    <div class="product-card product-card--featured">

        <h3 class="product-card__title">Featured Shoes</h3>

        <p class="product-card__price">₹799</p>

    </div>

</body>
</html>
